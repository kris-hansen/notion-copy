# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: notion-copy

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: notion-copy
    binary: notion-copy
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

brews:
  - name: notion-copy
    repository:
      owner: kris-hansen
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: Kris Hansen
      email: kris@4utopia.com
    directory: Formula
    homepage: "https://github.com/kris-hansen/notion-copy"
    description: "Sync markdown files with Notion pages"
    license: "MIT"
    test: |
      system "#{bin}/notion-copy", "--help"
    install: |
      bin.install "notion-copy"
